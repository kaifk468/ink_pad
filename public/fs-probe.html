<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InkPad storage probe</title>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; color: #23262d; background: #f7f8fa; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 6px 0 12px; color: #5d626b; }
  button { min-height: 48px; padding: 0 18px; margin: 0 8px 10px 0; border: 1px solid #475fdb; border-radius: 10px; background: #475fdb; color: #fff; font: inherit; font-weight: 700; }
  button.secondary { background: #fff; color: #475fdb; }
  pre { margin: 0; padding: 12px; border-radius: 10px; background: #fff; border: 1px solid #dfe2e8; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, monospace; }
</style>
</head>
<body>
<h1>InkPad storage probe</h1>
<p>Open this page in Chrome on the tablet, tap the buttons in order, then tap Copy results and paste them to Claude. Nothing here touches your diagrams.</p>
<button id="auto">1. Run automatic checks</button>
<button id="pick">2. Pick a folder and test it</button>
<button id="copy" class="secondary">Copy results</button>
<pre id="out">Not run yet.</pre>
<script>
const out = document.getElementById('out')
const lines = []
const log = (label, value) => { lines.push(`${label}: ${value}`); out.textContent = lines.join('\n') }
const ok = (v) => (v ? 'YES' : 'no')

async function auto() {
  lines.length = 0
  log('Time', new Date().toISOString())
  log('Address', location.href)
  log('Secure context (needed for all storage below)', ok(window.isSecureContext))
  log('Browser', navigator.userAgent)
  log('showDirectoryPicker (pick a real device folder)', ok(typeof window.showDirectoryPicker === 'function'))
  log('showOpenFilePicker', ok(typeof window.showOpenFilePicker === 'function'))
  log('showSaveFilePicker', ok(typeof window.showSaveFilePicker === 'function'))
  log('IndexedDB', ok('indexedDB' in window))
  const storage = navigator.storage
  log('navigator.storage', ok(storage))
  if (storage && storage.persist) {
    try { log('Persistent storage already granted', ok(await storage.persisted())) } catch (e) { log('persisted() error', e.message) }
    try { log('Persistent storage request granted', ok(await storage.persist())) } catch (e) { log('persist() error', e.message) }
  }
  if (storage && storage.estimate) {
    try { const e = await storage.estimate(); log('Storage quota / used', `${Math.round(e.quota / 1048576)} MB / ${Math.round(e.usage / 1048576)} MB`) } catch (e) { log('estimate() error', e.message) }
  }
  if (storage && storage.getDirectory) {
    try {
      const root = await storage.getDirectory()
      log('Private app folder (OPFS) opens', 'YES')
      const base = await root.getDirectoryHandle('probe-test', { create: true })
      const lld = await base.getDirectoryHandle('LLD', { create: true })
      const pay = await lld.getDirectoryHandle('Payments', { create: true })
      const file = await pay.getFileHandle('hello.inkpad', { create: true })
      const text = JSON.stringify({ probe: true, at: Date.now() })
      if (file.createWritable) {
        const w = await file.createWritable(); await w.write(text); await w.close()
        log('Write file with createWritable', 'YES')
      } else {
        log('Write file with createWritable', 'no (not available)')
      }
      const back = await (await file.getFile()).text()
      log('Read back inside LLD/Payments', back === text ? 'YES, identical' : `MISMATCH (${back.length} chars)`)
      const names = []
      for await (const [name, handle] of lld.entries()) names.push(`${handle.kind}:${name}`)
      log('Folder listing of LLD', names.join(', ') || '(empty)')
      await root.removeEntry('probe-test', { recursive: true })
      log('Cleanup', 'done')
    } catch (e) {
      log('Private app folder (OPFS) FAILED', `${e.name}: ${e.message}`)
    }
  } else {
    log('Private app folder (OPFS)', 'not available')
  }
  log('Next', 'tap "2. Pick a folder and test it"')
}

async function pick() {
  if (typeof window.showDirectoryPicker !== 'function') { log('Pick folder', 'not available in this browser'); return }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' })
    log('Picked folder', dir.name)
    const sub = await dir.getDirectoryHandle('inkpad-probe', { create: true })
    const nested = await sub.getDirectoryHandle('LLD', { create: true })
    const file = await nested.getFileHandle('hello.inkpad', { create: true })
    const w = await file.createWritable(); await w.write('probe'); await w.close()
    const back = await (await file.getFile()).text()
    log('Wrote inkpad-probe/LLD/hello.inkpad and read it back', back === 'probe' ? 'YES' : 'MISMATCH')
    log('Check', 'look in your Files app for the folder named inkpad-probe, then delete it')
  } catch (e) {
    log('Pick folder FAILED', `${e.name}: ${e.message}`)
  }
}

document.getElementById('auto').onclick = auto
document.getElementById('pick').onclick = pick
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(out.textContent); log('Copied', 'paste it to Claude') } catch (e) { log('Copy failed', 'select the text above and copy it by hand') }
}
</script>
</body>
</html>
